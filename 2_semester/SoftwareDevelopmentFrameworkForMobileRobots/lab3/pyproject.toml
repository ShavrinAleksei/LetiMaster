[project]
name = "lab3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Шаврин Алексей", email = "shavrin.ap@devzone.local" }
]
requires-python = ">=3.11"
dependencies = [
    "pika>=1.3.2",
    "pyside6>=6.11.0",
]

[project.scripts]
turtle-sim = "turtle_sim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/turtle_sim", 
    "src/turtle_comm", 
    "src/stalker",
    "src/stalker_chain",
]
