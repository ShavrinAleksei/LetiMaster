services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile_app
    ports:
      - "127.0.0.1:8080:5000"
      - "127.0.0.1:2222:22"
    cpu_count: 1
    restart: unless-stopped

  tester:
    build:
      context: .
      dockerfile: tester/Dockerfile_tester
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - app
    volumes:
      - ./tester/logs:/logs
    environment:
      - TEST_STEPS=${TEST_STEPS:-all}
    cpu_count: 1
    restart: unless-stopped